services:
  mysql:
    image: mysql:8.0
    container_name: back-huellas-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-huellas_del_valle}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${DB_PASSWORD:-root} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - back-huellas-net

volumes:
  mysql_data:
    name: back_huellas_mysql_data

networks:
  back-huellas-net:
    name: back-huellas-net
    driver: bridge
